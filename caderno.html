<title>Caderno de Línguas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&family=Kalam:wght@400;700&family=Young+Serif&display=swap">
<style>
/* Layout: um caderno corrigido. Coluna estreita; a questão ocupa uma folha (Seyès no francês, quadriculado no espanhol);
   correções em caneta vermelha sobre o próprio texto. A paleta troca com a língua do dia. */
:root{
  --paper:#eceee8; --sheet:#ffffff; --sunk:#e3e6de; --line:#bfc6b9; --rule:#e4e9f4; --rule2:#cdd6ec; --margin:#efc4c4;
  --ink:#111827; --muted:#465063; --accent:#1a3480; --accent-soft:#d6def2; --on-accent:#ffffff;
  --pen:#c3232c; --pen-soft:#f7dcdc; --ok:#2c7448; --ok-soft:#dbeee1; --warn:#9a6b06; --warn-soft:#f5ead0;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand:"Kalam", "Segoe Print", "Bradley Hand", cursive;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:10px;
}
:root[data-l="es"]{
  --paper:#efe8dc; --sheet:#fffdf9; --sunk:#e8ddcb; --line:#cdbb9c; --rule:#f1e9dc; --rule2:#e6d8c1; --margin:#eec5b2;
  --ink:#1f160f; --muted:#5a4a3b; --accent:#963a22; --accent-soft:#f3dfd6; --on-accent:#ffffff;
  --warn:#9a6b06; --warn-soft:#f5ead0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0d121a; --sheet:#141b26; --sunk:#0a0e14; --line:#2f3a50; --rule:#18202e; --rule2:#1f2a3d; --margin:#4a2a30;
    --ink:#f1f4f9; --muted:#b9c2d1; --accent:#8fa8ec; --accent-soft:#1c2a4a; --on-accent:#0b1324;
    --pen:#ff7b7b; --pen-soft:#3a1d22; --ok:#7cc79a; --ok-soft:#173022; --warn:#e3b553; --warn-soft:#33290f; color-scheme:dark;
  }
  :root:not([data-theme="light"])[data-l="es"]{
    --paper:#140f0b; --sheet:#1d1611; --sunk:#0f0b08; --line:#46372b; --rule:#241c16; --rule2:#2f251d; --margin:#4a2a20;
    --ink:#f6efe7; --muted:#cdbfae; --accent:#e58b6c; --accent-soft:#3d2219; --on-accent:#1d0f0a;
  }
}
:root[data-theme="dark"]{
  --paper:#0d121a; --sheet:#141b26; --sunk:#0a0e14; --line:#2f3a50; --rule:#18202e; --rule2:#1f2a3d; --margin:#4a2a30;
  --ink:#f1f4f9; --muted:#b9c2d1; --accent:#8fa8ec; --accent-soft:#1c2a4a; --on-accent:#0b1324;
  --pen:#ff7b7b; --pen-soft:#3a1d22; --ok:#7cc79a; --ok-soft:#173022; --warn:#e3b553; --warn-soft:#33290f; color-scheme:dark;
}
:root[data-theme="dark"][data-l="es"]{
  --paper:#140f0b; --sheet:#1d1611; --sunk:#0f0b08; --line:#46372b; --rule:#241c16; --rule2:#2f251d; --margin:#4a2a20;
  --ink:#f6efe7; --muted:#cdbfae; --accent:#e58b6c; --accent-soft:#3d2219; --on-accent:#1d0f0a;
}

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--paper)}
.wrap{max-width:680px;margin:0 auto;display:grid;gap:18px}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:34px;line-height:1.1}
h2{font-size:23px;line-height:1.2}
h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--paper);padding-block:12px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;max-width:680px;margin:0 auto}
.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
.tabs button{border:0;background:transparent;color:var(--ink);padding:7px 11px;border-radius:999px;font-weight:700;font-size:14.5px;color:var(--muted);white-space:nowrap}
.tabs button[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.gear{border:1px solid var(--line);background:var(--sheet);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.gear[aria-current="page"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.gear svg{width:19px;height:19px}

/* Hoje */
.dayhead{display:grid;gap:6px;padding-top:18px}
.dayhead .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:3px 11px;font-size:13.5px;font-weight:700}
.pill.acc{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.pill.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.pen{background:var(--pen-soft);border-color:transparent;color:var(--pen)}
.streak{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.streak b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tog{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 12px;font-size:14.5px;font-weight:600;text-align:left}
.tog .box{width:18px;height:18px;border-radius:5px;border:2px solid var(--muted);display:grid;place-items:center;flex:none}
.tog[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tog[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.tog[aria-pressed="true"] .box::after{content:"";width:8px;height:4px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:rotate(-45deg) translate(1px,-1px)}
.hard[aria-pressed="true"]{border-color:var(--warn);background:var(--warn-soft)}
.hard[aria-pressed="true"] .box{background:var(--warn);border-color:var(--warn)}

.runsheet{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);overflow:hidden}
.slot{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:13px;color:var(--muted)}
.slot.done .n{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.slot.now .n{border-color:var(--accent);color:var(--accent);border-width:2px}
.slot .t{min-width:0}
.slot .t b{display:block;font-size:16px}
.slot .t span{font-size:13.5px;color:var(--muted)}
.slot.done .t b{color:var(--muted)}
.slot.off{opacity:.55}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:9px;padding:9px 14px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pen{border-color:var(--pen);color:var(--pen);background:transparent}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding-inline:6px}
.btn.small{padding:6px 10px;font-size:13.5px}
.btn.wide{width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.card.banner{border-color:var(--ok);background:var(--ok-soft)}
.card.warnb{border-color:var(--warn);background:var(--warn-soft)}
.note{font-size:14px;color:var(--muted)}
.empty{padding:22px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:14.5px}

/* Sessão (foco) */
.focus{max-width:680px;margin:0 auto;display:grid;gap:14px;padding-top:6px}
.fbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--paper);padding-block:10px 8px;display:grid;gap:8px}
.fbar .row{justify-content:space-between;flex-wrap:nowrap}
.tbar{height:5px;border-radius:99px;background:var(--sunk);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .9s linear}
.tbar.late i{background:var(--warn)}
.clock{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.clock.late{color:var(--warn);font-weight:600}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--sunk);border:1px solid var(--line)}
.dots i.d2{background:var(--ok);border-color:var(--ok)}
.dots i.d1{background:var(--warn);border-color:var(--warn)}
.dots i.d0{background:var(--pen);border-color:var(--pen)}
.dots i.cur{border-color:var(--accent);border-width:2px}

/* Folha: Seyès (fr) / quadriculado (es) */
.sheetp{position:relative;border:1px solid var(--line);border-radius:var(--r);background-color:var(--sheet);padding:20px 18px 20px 42px;display:grid;gap:14px;
  background-image:
    linear-gradient(90deg, transparent 30px, var(--margin) 30px, var(--margin) 31.5px, transparent 31.5px),
    repeating-linear-gradient(180deg, transparent 0 31px, var(--rule2) 31px 32px),
    repeating-linear-gradient(180deg, transparent 0 7px, var(--rule) 7px 8px);}
:root[data-l="es"] .sheetp{
  background-image:
    linear-gradient(90deg, transparent 30px, var(--margin) 30px, var(--margin) 31.5px, transparent 31.5px),
    repeating-linear-gradient(180deg, transparent 0 19px, var(--rule) 19px 20px),
    repeating-linear-gradient(90deg, transparent 0 19px, var(--rule) 19px 20px);}
.sheetp .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qinstr{font-weight:700;font-size:15px}
.qprompt{font-size:20px;line-height:1.5;font-family:var(--display)}
.qprompt.pt{font-family:var(--body);font-style:italic;font-size:19px}
textarea,input[type=text],select{font:inherit;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:92px;resize:vertical;line-height:1.55}
textarea:focus,input:focus,select:focus{border-color:var(--accent);outline:none}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--sheet);border-radius:9px;padding:11px 13px;font-size:17px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);border-width:2px;background:var(--ok-soft);color:var(--ink)}
.opt.wrong{border-color:var(--pen);border-width:2px;background:var(--pen-soft);color:var(--ink);text-decoration:line-through;text-decoration-color:var(--pen)}
.cloze{line-height:2.4}
input.blank{display:inline-block;width:auto;min-width:5ch;max-width:16ch;field-sizing:content;font:inherit;font-family:var(--body);font-size:18px;padding:2px 6px;margin:0 3px;border:0;border-bottom:2px solid var(--accent);border-radius:4px 4px 0 0;background:var(--accent-soft);color:var(--ink)}
.okfill{color:var(--ok);font-family:var(--hand);font-size:20px;font-weight:400}
.listen{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Correção em caneta vermelha */
.pen{font-size:18px;line-height:2.25;font-family:var(--body)}
.mk{position:relative;white-space:nowrap}
.mk del{text-decoration:line-through;text-decoration-color:var(--pen);text-decoration-thickness:2px;color:inherit}
.mk ins{text-decoration:none;font-family:var(--hand);color:var(--pen);font-size:19px;margin-left:3px}
.mk sup{font-family:var(--hand);color:var(--pen);font-size:13px;margin-left:1px}
.verdict{font-family:var(--hand);color:var(--pen);font-size:26px;line-height:1}
.verdict.ok{color:var(--ok)}
.verdict.mid{color:var(--warn)}
.notes{margin:0;padding:0;list-style:none;display:grid;gap:10px;border-left:2px solid var(--pen);padding-left:12px}
.notes .note-i{display:grid;gap:3px;font-size:15.5px;color:var(--ink)}
.notes .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.notes .num{font-family:var(--hand);color:var(--pen);font-size:17px}
.notes .fix{font-family:var(--hand);color:var(--pen);font-size:17px}
.notes .pt{color:var(--muted);font-style:italic}
.cat{font-size:12.5px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.cat.ptf{background:var(--warn-soft);color:var(--warn)}
.corr{font-family:var(--hand);font-size:19px;color:var(--ok);line-height:1.4}
.why{font-size:15px;color:var(--ink)}
.ptbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:13.5px;padding:0;text-align:left}
.doubt{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.qa{display:grid;gap:4px;font-size:15px;background:var(--sunk);border-radius:8px;padding:10px 12px}
.thinking{font-family:var(--hand);color:var(--muted);font-size:18px}

/* Redação */
.scaffold{display:grid;gap:10px}
.scaffold ul{margin:0;padding-left:20px;display:grid;gap:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:14px;background:var(--sheet)}
button.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.essay-in{min-height:260px;font-size:17px;line-height:32px;background-color:transparent;border-style:dashed}
.wc{font-family:var(--mono);font-size:13px;color:var(--muted)}
.wc.ok{color:var(--ok)}
.rubric{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.rb{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:4px;background:var(--sheet)}
.rb .s{font-family:var(--hand);color:var(--pen);font-size:22px;line-height:1}
.rb .bar{height:4px;border-radius:9px;background:var(--sunk);overflow:hidden}
.rb .bar i{display:block;height:100%;background:var(--accent)}
.margin-note{font-family:var(--hand);color:var(--pen);font-size:18px;line-height:1.4;border-left:2px solid var(--pen);padding-left:12px}

/* Progresso */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:1px solid var(--line);border-radius:9px;padding:8px 4px;display:grid;justify-items:center;gap:4px;background:var(--sheet);font-size:12.5px}
.wd b{font-size:13px}
.wd i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line)}
.wd.full i{background:var(--ok);border-color:var(--ok)}
.wd.min i{background:var(--warn);border-color:var(--warn)}
.wd.part i{border-color:var(--accent)}
.wd.today{border-color:var(--accent);border-width:2px}
.wd.fut{opacity:.5}
.hm{overflow-x:auto}
.hm table{border-collapse:separate;border-spacing:3px;font-size:13px;min-width:100%}
.hm th{font-weight:600;color:var(--muted);text-align:left;white-space:nowrap;padding-right:6px}
.hm td{width:42px;height:28px;border-radius:5px;text-align:center;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:7px}
.bar-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:14px}
.bar-row .tr{height:9px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar-row .tr i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar-row .tr i.lo{background:var(--pen)}
.bar-row .tr i.mid{background:var(--warn)}
.bar-row .v{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.bar-row .nm{min-width:0;overflow-wrap:anywhere}
.delta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.delta{grid-template-columns:1fr}}
.chart svg{width:100%;height:auto;display:block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:5px 13px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* Caderno */
.err{display:grid;gap:4px;border-top:1px solid var(--line);padding-block:12px}
.err:first-child{border-top:0}
.err .ln{font-size:17px}
.err .ln del{text-decoration-color:var(--pen);text-decoration-thickness:2px}
.err .ln ins{text-decoration:none;font-family:var(--hand);color:var(--pen);font-size:18px;margin-left:6px}

/* Ajustes */
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.field{display:grid;gap:5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--paper);padding:9px 15px;border-radius:9px;font-size:14.5px;z-index:9;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.tbar i{transition:none}}
</style>
<div id="app"></div>
<script>
"use strict";
// Temas por nível (A2–C1) + transversais ('*'), categorias de erro fixas, tipos e tarefas de redação.
const LEVELS = ["A2", "B1", "B2", "C1"];

const TOPICS = {
  fr: [
    // A2
    { id: "fr_preg", lv: "A2", n: "Présent des verbes réguliers (-er, -ir, -re)" },
    { id: "fr_pres", lv: "A2", n: "Présent des verbes irréguliers" },
    { id: "fr_pc", lv: "A2", n: "Passé composé (être ou avoir)" },
    { id: "fr_imp", lv: "A2", n: "Imparfait : description et habitude" },
    { id: "fr_fproche", lv: "A2", n: "Futur proche" },
    { id: "fr_art", lv: "A2", n: "Articles et partitif", pt: 1 },
    { id: "fr_neg", lv: "A2", n: "Négation" },
    { id: "fr_adj", lv: "A2", n: "Adjectifs : accord et place" },
    { id: "fr_poss", lv: "A2", n: "Possessifs et démonstratifs" },
    { id: "fr_prep", lv: "A2", n: "Prépositions de lieu et de temps", pt: 1 },
    { id: "fr_cod", lv: "A2", n: "Pronoms COD et COI" },
    { id: "fr_comp", lv: "A2", n: "Comparatif et superlatif" },
    { id: "fr_quest", lv: "A2", n: "Questions" },
    { id: "fr_impe", lv: "A2", n: "Impératif" },
    { id: "fr_pronom", lv: "A2", n: "Verbes pronominaux" },
    { id: "fr_plur", lv: "A2", n: "Noms : genre et pluriel", pt: 1 },
    { id: "fr_cest", lv: "A2", n: "C'est, il est, il y a" },
    { id: "fr_quique", lv: "A2", n: "Relatifs qui et que" },
    { id: "fr_adv", lv: "A2", n: "Adverbes (bien, bon, beaucoup, très, -ment)", pt: 1 },
    { id: "fr_venirde", lv: "A2", n: "Passé récent (venir de)" },

const LANG_LIST = ["fr", "es"];
const TOPIC = {};
for (const L of LANG_LIST) for (const t of TOPICS[L]) TOPIC[t.id] = { ...t, l: L };

// Banco seed → objetos com id estável (tema-índice)
function buildSeeds() {
  const out = [];
  for (const [L, S] of [["fr", SEED_FR], ["es", SEED_ES]]) {
    const n = {};
    for (const [t, ty, p, a, x] of S) {
      n[t] = (n[t] || 0) + 1;
      const lv = TOPIC[t].lv === "*" ? "A2" : TOPIC[t].lv;
      out.push({ id: `${t}-${n[t]}`, l: L, lv, t, ty, p, a, o: x.o || null, i: x.i || null, c: x.c, src: "seed" });
    }
  }
  return out;
}

function defaultState() { return { level: "A2", levelSince: today(), session: 0, lastSession: null, srs: {}, boost: {}, discarded: [] }; }

// ---------- datas ----------
const pad = n => String(n).padStart(2, "0");

const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };

// ---------- persistência ----------

const saveState = L => save("state", L, APP.st[L]);

// ---------- questões ----------
function allQuestions(L) {
  const st = APP.st[L];
  const disc = new Set(st.discarded || []);
  return [...SEEDS.filter(q => q.l === L), ...APP.gq.filter(q => q.l === L)].filter(q => !disc.has(q.id) && !q.disc);
}

}

const anyLevel = q => !!(TOPIC[q.t] && TOPIC[q.t].lv === "*"); // ditado, homófonos, falsos amigos: valem em todo nível
function levelTopics(L, lv) {
  return TOPICS[L].filter(t => (t.lv === lv || t.lv === "*") && !t.id.endsWith("_vocab") && (hasVoice(L) || !(t.id === "fr_dictee" || t.id === "es_dict")));
}

// ---------- calendário ----------
function template(date) {
  const wd = parseYmd(date).getDay();
  return ({ 1: { k: "mon" }, 2: { k: "cls", l: "es" }, 3: { k: "cls", l: "fr" }, 4: { k: "cls", l: "es" }, 5: { k: "cls", l: "fr" }, 6: { k: "we", l: "fr" }, 0: { k: "we", l: "es" } })[wd];
}
const dayDoc = date => APP.days[date] || {};
function classOn(date, L) {
  const d = dayDoc(date), k = "class_" + L;
  if (typeof d[k] === "boolean") return d[k];
  const tp = template(date);
  return tp.k === "cls" && tp.l === L;
}
function blocksDone(date, L) { return APP.blocks.filter(b => b.status === "done" && b.doneDate === date && (!L || b.lang === L)); }
function weekBlockCount(date, L) {
  const ws = weekStart(date);
  return APP.blocks.filter(b => b.status === "done" && b.lang === L && b.doneDate >= ws && b.doneDate < date).length;
}
function lessLang(date) { return weekBlockCount(date, "fr") <= weekBlockCount(date, "es") ? "fr" : "es"; }

function plan(date) {
  const tp = template(date), d = dayDoc(date), hard = !!d.hard;
  const cls = LANG_LIST.filter(L => classOn(date, L));
  const p = { date, tp, hard, cls, req: [], essay: null, kind: "", monday: false, langs: [] };
  if (cls.length) {
    p.kind = hard ? "min" : "class";
    cls.forEach(L => p.req.push({ L, n: hard ? 0 : 1 }));
    if (tp.k === "we") p.essay = { L: tp.l, optional: true };
  } else if (tp.k === "cls") {
    p.kind = hard ? "min" : "long";
    p.req.push({ L: tp.l, n: hard ? 1 : 4 });
  } else if (tp.k === "mon") {
    if (hard) { p.kind = "min"; p.req.push({ L: lessLang(date), n: 1 }); }
    else { p.kind = "long"; p.monday = true; p.req.push({ L: "fr", n: 2 }, { L: "es", n: 2 }); }
  } else {
    if (hard) { p.kind = "min"; p.req.push({ L: tp.l, n: 1 }); }
    else { p.kind = "long"; p.req.push({ L: tp.l, n: 1 }); p.essay = { L: tp.l, optional: false }; }
  }
  p.langs = [...new Set([...p.req.map(r => r.L), ...(p.essay ? [p.essay.L] : [])])];
  if (!p.langs.length) p.langs = cls.length ? cls : [tp.l || "fr"];

}
function essayDoneOn(date, L) { return APP.essays.some(e => e.date === date && e.lang === L && e.status === "done"); }
function dayStatus(date) {
  const p = plan(date);

  const essOk = !p.essay || p.essay.optional || p.hard || essayDoneOn(date, p.essay.L);

// Próxima língua na segunda: alterna começando pela que teve menos blocos na semana
function mondayNextLang(date) {
  const first = lessLang(date), other = first === "fr" ? "es" : "fr";
  const df = blocksDone(date, first).length, dO = blocksDone(date, other).length;
  if (df >= 2 && dO >= 2) return null;
  return df < 2 ? first : other;
}
// Língua da interface
function uiLang() {
  if (APP.screen && APP.screen.lang) return APP.screen.lang;
  const date = today(), p = plan(date);
  if (p.cls.length) return p.cls[0];
  if (p.monday) return mondayNextLang(date) || lessLang(date);
  return p.langs[0] || "fr";
}
function syncDayFlags(date) {
  const { complete, p } = dayStatus(date);
  const d = { ...(APP.days[date] || {}) };
  const minimal = complete && p.hard;
  if (!!d.complete !== complete || !!d.minimal !== minimal) {

function streak() {
  let s = 0, date = today();

  while (dayDoc(date).complete) { s++; date = addDays(date, -1); }
  return s;
}
function last28() { let n = 0; for (let i = 0; i < 28; i++) if (dayDoc(addDays(today(), -i)).complete) n++; return n; }

// ---------- estatísticas ----------
function recentAttempts(L, days, from) {
  const end = from || today(), start = addDays(end, -days + 1);
  return APP.attempts.filter(a => a.lang === L && a.date >= start && a.date <= end && a.score != null);
}
function topicStats(L, days) {
  const m = {};
  for (const a of recentAttempts(L, days)) {
    const s = m[a.topic] || (m[a.topic] = { n: 0, pts: 0 });
    s.n++; s.pts += a.score;
  }
  return m;
}
function catErrorRate(L, cat) {
  const att = recentAttempts(L, 28).filter(a => a.qcat === cat);
  if (att.length < 5) return 0;
  return att.filter(a => (a.errors || []).some(e => e.cat === cat) || a.score === 0).length / att.length;
}
function levelStatus(L) {
  const st = APP.st[L], lv = st.level, inLevel = daysBetween(st.levelSince, today());
  const att = recentAttempts(L, 28).filter(a => a.qlv === lv || (TOPIC[a.topic] && TOPIC[a.topic].lv === "*"));
  const acc = att.length ? att.reduce((s, a) => s + a.score, 0) / (2 * att.length) : 0;
  const topics = levelTopics(L, lv).map(tp => {
    const ta = att.filter(a => a.topic === tp.id);
    const tacc = ta.length ? ta.reduce((s, a) => s + a.score, 0) / (2 * ta.length) : 0;
    return { id: tp.id, n: ta.length, acc: tacc, ok: ta.length >= 5 && tacc >= 0.8 };
  });

// ---------- montagem do bloco ----------
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildBlockItems(L) {
  const st = APP.st[L], size = APP.settings.blockSize[L] || 8;
  const pool = allQuestions(L).filter(q => q.ty !== "dit" || hasVoice(L));
  const byId = Object.fromEntries(pool.map(q => [q.id, q]));
  const chosen = [], topicCount = {};
  const add = q => { chosen.push(q.id); topicCount[q.t] = (topicCount[q.t] || 0) + 1; };
  // 1) revisões vencidas (até 3)
  const due = Object.entries(st.srs || {})
    .filter(([id, e]) => !e.retired && e.due <= st.session && byId[id] && byId[id].src !== "texto")
    .sort((a, b) => a[1].due - b[1].due);
  for (const [id] of due) { if (chosen.length >= 3) break; if ((topicCount[byId[id].t] || 0) < 2) add(byId[id]); }
  // 2) novas
  const seen = attemptedIds(L);
  const fresh = pool.filter(q => !seen.has(q.id) && !chosen.includes(q.id));
  const lvOk = q => q.lv === st.level || anyLevel(q) || q.src === "aula" || q.src === "erro" || q.src === "texto";
  const priority = shuffle(fresh.filter(q => (q.src === "erro" || q.src === "aula") && lvOk(q)));
  const boosted = new Set(Object.entries(st.boost || {}).filter(([, until]) => until >= st.session).map(([k]) => k));
  const tstat = topicStats(L, 28);
  const weight = tp => {
    const s = tstat[tp] || { n: 0, pts: 0 };
    const err = s.n ? 1 - s.pts / (2 * s.n) : 0.5;
    return 1 + 3 * err + 2 / (1 + s.n) + (boosted.has(tp) ? 3 : 0);
  };
  const closedShare = () => chosen.filter(id => QTYPES[(byId[id] || qById(id)).ty].closed).length / Math.max(1, chosen.length);
  const pickFrom = cands => {
    const ok = cands.filter(q => (topicCount[q.t] || 0) < 2 && !chosen.includes(q.id));
    if (!ok.length) return null;
    const wantClosed = closedShare() < 0.25;
    const pref = ok.filter(q => QTYPES[q.ty].closed === wantClosed);
    const list = pref.length ? pref : ok;
    const w = q => weight(q.t) * (q.ty === "mc" ? 0.3 : 1); // múltipla escolha quase não ensina mais nada
    const tot = list.reduce((s, q) => s + w(q), 0);
    let r = Math.random() * tot;
    for (const q of list) { r -= w(q); if (r <= 0) return q; }
    return list[list.length - 1];
  };
  for (const q of priority) { if (chosen.length >= size) break; if ((topicCount[q.t] || 0) < 2) add(q); }
  const levelFresh = fresh.filter(lvOk).filter(q => q.src !== "texto");
  while (chosen.length < size) { const q = pickFrom(levelFresh); if (!q) break; add(q); }
  // 3) sem novas suficientes: repete as mais antigas do nível
  if (chosen.length < size) {
    const old = pool.filter(q => (q.lv === st.level || anyLevel(q)) && !chosen.includes(q.id))
      .sort((a, b) => ((st.srs[a.id] || {}).last || 0) - ((st.srs[b.id] || {}).last || 0));

  }
  return shuffle(chosen);
}
function unseenByTopic(L) {
  const seen = attemptedIds(L), out = {};
  for (const q of allQuestions(L)) {
    const o = out[q.t] || (out[q.t] = { total: 0, done: 0, unseen: 0 });
    o.total++; if (seen.has(q.id)) o.done++; else o.unseen++;
  }
  return out;
}
function startSession(L) {
  const st = APP.st[L], d = today();
  if (st.lastSession !== d) { st.session = (st.session || 0) + 1; st.lastSession = d; saveState(L); }
}

// ---------- correção local (fechadas) ----------
const normTxt = s => String(s || "").replace(/[¿¡]/g, "").trim().replace(/[’`´]/g, "'").replace(/\s+/g, " ").replace(/\s*([?!:;])/g, " $1").toLowerCase();

// Texto com lacunas: cada lacuna aceita alternativas separadas por "|"
function gradeCloze(q, blanks) {
  let wrong = 0, accentOnly = 0; const errors = [];
  q.a.forEach((alts, i) => {
    const opts = String(alts).split("|"), v = (blanks[i] || "").trim(), n = normTxt(v);
    if (opts.some(o => normTxt(o) === n)) return;
    if (n && opts.some(o => stripAcc(normTxt(o)) === stripAcc(n))) { accentOnly++; errors.push({ cat: q.l === "fr" ? "ortho" : "acen", frag: v, fix: opts[0], why: "", why_pt: "", pt: false, ortho: true, blank: i }); return; }
    wrong++; errors.push({ cat: q.c, frag: v || "∅", fix: opts[0], why: "", why_pt: "", pt: !!TOPIC[q.t].pt, ortho: false, blank: i });
  });
  const score = wrong === 0 ? (accentOnly ? 1 : 2) : (wrong === 1 && q.a.length >= 3 ? 1 : 0);
  return { score, targetOk: score > 0, errors };
}
function gradeClosed(q, answer, blanks) {
  if (q.ty === "cloze") return gradeCloze(q, blanks || []);
  const a = normTxt(answer);
  if (q.a.some(x => normTxt(x) === a)) return { score: 2, targetOk: true, errors: [] };
  if (q.ty !== "mc" && a && q.a.some(x => stripAcc(normTxt(x)) === stripAcc(a))) {
    return { score: 1, targetOk: true, errors: [{ cat: q.l === "fr" ? "ortho" : "acen", frag: answer.trim(), fix: q.a[0], why: "", why_pt: "", pt: false, ortho: true }] };
  }
  return { score: 0, targetOk: false, errors: [{ cat: q.c, frag: answer.trim(), fix: q.a[0], why: "", why_pt: "", pt: !!TOPIC[q.t].pt, ortho: false }] };
}

// ---------- dificuldade e revisão espaçada ----------
function classify(att, q) {
  const exp = QTYPES[q.ty].exp * 1000;
  const slow = att.answerMs > exp * 1.5;
  const doubt = (att.doubts || []).length > 0;
  const replays = (att.replays || 0) >= 3;
  const weak = catErrorRate(att.lang, q.c) >= 0.4;
  if (att.score === 0) return { dif: "hard", why: "r0" };
  if (att.score === 1) return weak ? { dif: "hard", why: "r1weak" } : { dif: "mid", why: "r1" };
  if (doubt) return { dif: "mid", why: "rdoubt" };
  if (replays) return { dif: "mid", why: "rreplay" };
  if (slow) return { dif: "mid", why: "rslow" };
  if (weak) return { dif: "mid", why: "rweak" };
  return { dif: "easy", why: "reasy" };
}
function applySrs(L, qid, dif, prevEntry) {
  const st = APP.st[L];
  const e = { ...(prevEntry || st.srs[qid] || { iv: 0 }) };
  if (dif === "hard") e.iv = 1;
  else if (dif === "mid") e.iv = 4;
  else {
    if (e.iv >= 30) e.retired = true;
    e.iv = e.iv >= 14 ? 30 : e.iv >= 7 ? 14 : 7;
  }
  if (dif !== "easy") e.retired = false;
  e.due = st.session + e.iv; e.last = Date.now(); e.dif = dif;

function wordCount(s) { return (String(s || "").trim().match(/[\p{L}\p{N}'’-]+/gu) || []).length; }

// ===== Chamadas ao Claude (correção, dúvidas, contestação, geração) =====
const LNAME = { fr: "French (France, Paris norm)", es: "Spanish (Spain, Madrid norm)" };
const LOUT = { fr: "French", es: "Spanish" };
const TYPE_DESC = {
  lac: "fill in the blank (short exact answer)", mc: "multiple choice (answer must be one of the options)",
  trad: "translate the Portuguese sentence", transf: "transform the sentence following the instruction",
  erro: "find and correct the error in the sentence", dit: "dictation (learner hears the sentence and writes it)",
  mini: "mini-production: 1–3 sentences answering a given situation",
  cloze: "short text with several blanks (___), each filled with one form",
  corr: "the sentence may contain zero, one or several errors, or be fully correct; the learner must rewrite it entirely corrected, or copy it unchanged if it is correct (changing a correct form is an error)"
};
const LEARNER = (L, lv) => `The learner is a Brazilian Portuguese speaker studying ${LNAME[L]}; current CEFR level ${lv}. ${L === "fr" ? "He grew up speaking French orally, so he writes by ear: watch for phonetic spelling, silent agreements, homophones and accents." : "Portuguese makes him understand almost everything, so his production slides into 'portuñol': watch for Portuguese interference in vocabulary, structure and spelling. His keyboard has no ¿ or ¡: NEVER count a missing opening ¿ or ¡ as an error, and do not list it."}`;

function catList(L) { return Object.keys(CATS[L]).map(k => `${k} (${CATS[L][k]})`).join(", "); }
function topicList(L, lv) {
  return TOPICS[L].filter(t => !lv || t.lv === lv || t.lv === "*").map(t => `${t.id} [${t.lv}] ${t.n}`).join("\n");
}
async function ask(prompt, opts) {
  if (!APP.sample) throw { code: "not_granted" };
  return APP.sample.json(prompt, { modelTier: "default", effort: "low", ...(opts || {}) });
}
function cleanErrors(L, errs) {
  const cats = CATS[L];
  return (Array.isArray(errs) ? errs : []).map(e => ({
    cat: cats[pick(e, ["category", "categoria"])] ? pick(e, ["category", "categoria"]) : null,
    frag: String(pick(e, ["text", "trecho", "fragment"]) || ""),
    fix: String(pick(e, ["fix", "correcao", "correção", "correction", "corrected", "correcta"]) || ""),
    why: String(pick(e, ["why", "porque", "explanation"]) || ""), why_pt: String(pick(e, ["why_pt", "porque_pt"]) || ""),

const ERR_SCHEMA = `{"category":"<one id>","text":"<exact substring of the learner text that is wrong>","fix":"<the corrected form of exactly that substring; never empty>","why":"<explanation in ${"{LOUT}"}>","why_pt":"<same in Portuguese>","pt_interference":true|false,"spelling":true|false}`;

// Correção de uma questão aberta (ou ditado)
async function correctOpen(q, answer) {
  const L = q.l, lv = APP.st[L].level, tp = TOPIC[q.t];
  const errSchema = ERR_SCHEMA.replace("{LOUT}", LOUT[L]);
  const base = `You are a strict ${LNAME[L]} writing examiner. No praise, no softening. List EVERY error, including accents and punctuation that change correctness. Do NOT count a missing final period, capitalisation of the first word, or a missing opening ¿ / ¡.
${LEARNER(L, lv)}

Exercise type: ${TYPE_DESC[q.ty]}
${q.i ? "Instruction: " + q.i + "\n" : ""}Prompt: ${q.p}
${q.ty === "dit" ? `Dictated sentence (the learner must write exactly this sentence; any different word or spelling is an error): ${q.a[0]}` : `Reference answer(s) (any other correct, natural ${LOUT[L]} formulation is also fully correct): ${q.a.join(" | ")}`}
Target structure: ${tp.n}${SUBS[q.t] ? " (" + SUBS[q.t].join("; ") + ")" : ""}
Learner answer: """${answer}"""

Scoring:
- nota 2: fully correct (any valid formulation; ${L === "es" ? "use Peninsular Spanish norms" : "use metropolitan French norms"}).
- nota 1: the target structure is correct but there is at least one other error (a wrong or missing accent counts).
- nota 0: the target structure is wrong, missing, or the answer does not do the task.
For each error: category must be one of these ids: ${catList(L)}.
"why" must be in ${LOUT[L]}, in short simple sentences a ${lv} learner understands; "why_pt" is the same explanation in Brazilian Portuguese.
versao_corrigida: the learner's answer minimally corrected (keep his wording when it is valid).
feedback: one sentence in ${LOUT[L]} at ${lv} level; feedback_pt: same in Portuguese.
Reply with only JSON: {"nota":0|1|2,"tema_ok":true|false,"erros":[${errSchema}],"versao_corrigida":"","feedback":"","feedback_pt":""}`;

const GEN_ITEM = L => `{"tema":"<topic id>","tipo":"cloze|corr|lac|mc|trad|transf|erro|${L ? "dit|" : ""}mini","enunciado":"","instrucao":"","opcoes":[],"respostas":[""],"categoria":"<category id>"}`;
function validateGen(L, raw, fallbackTopic, src, lvOverride) {
  const items = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.questoes) ? raw.questoes : []);
  const out = [];
  for (const it of items) {
    const ty = String(it.tipo || "");
    const t = TOPIC[it.tema] && TOPIC[it.tema].l === L ? it.tema : fallbackTopic;
    if (!t || !QTYPES[ty]) continue;
    if (ty === "dit" && !hasVoice(L)) continue;
    const p = String(it.enunciado || "").trim();
    const a = (Array.isArray(it.respostas) ? it.respostas : [it.respostas]).map(x => String(x || "").trim()).filter(Boolean);
    if (!p || !a.length) continue;
    let o = null;
    if (ty === "mc") { o = (it.opcoes || []).map(x => String(x).trim()).filter(Boolean); if (o.length < 2 || !o.includes(a[0])) continue; }
    if (ty === "lac" && !p.includes("___")) continue;
    if (ty === "cloze" && (p.split("___").length - 1 !== a.length || a.length < 2)) continue;
    if (ty === "transf" && !String(it.instrucao || "").trim()) continue;
    const c = CATS[L][it.categoria] ? it.categoria : (Object.keys(CATS[L]).includes("conj") ? "conj" : Object.keys(CATS[L])[0]);
    const tlv = TOPIC[t].lv === "*" ? (lvOverride || APP.st[L].level) : TOPIC[t].lv;
    out.push({ id: uid("q"), l: L, lv: tlv, t, ty, p, a, o, i: String(it.instrucao || "").trim() || null, c, src, created: Date.now() });
  }
  return out;
}

const W_KEYS = ["tarefa", "organizacao", "desenvolvimento", "coesao", "clareza", "adequacao"];
const L_KEYS = ["gramatica", "vocabulario", "ortografia"];

  const lv = APP.st[L].level, task = essay.task;

  const base = `You are a strict ${LNAME[L]} writing examiner and a writing coach. No praise for its own sake.

"""${essay.text}"""

1) General writing skill (independent of language, scores 0–5): tarefa (covered every required point), organizacao (opening, development, closing; paragraphs with a clear role), desenvolvimento (ideas explained and supported, not just listed), coesao (sentences and paragraphs connected), clareza (understandable at first reading), adequacao (register and tone right for the format and reader).
2) Language (0–5): gramatica, vocabulario, ortografia; nivel = CEFR level of the language shown (A1–C2).

  let r = await ask(base, { cache: false });
  let errors = cleanErrors(L, r.erros);
  if (errors.some(e => !e.cat)) errors = errors.map(e => ({ ...e, cat: e.cat || "synt" }));
  const num = (o, k) => Math.max(0, Math.min(5, Number((o || {})[k]) || 0));

// Só vozes nativas: código exato fr-FR / es-ES, sem vozes multilíngues nem vozes de efeito.
const BAD_VOICE = /multilingual|multilingue|eddy|flo\b|grand(ma|pa)|reed|rocko|sandy|shelley|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|fred|junior|kathy|ralph/i;
const GOOD_VOICE = { fr: [/google fran/i, /thomas/i, /audrey/i, /aurélie|aurelie/i, /marie/i, /denise/i, /henri/i, /eloise|éloïse/i, /google fran/i], es: [/google español$/i, /google español de españa/i, /mónica|monica/i, /jorge/i, /marisol/i, /elvira/i, /álvaro|alvaro/i, /google español$/i, /google español de españa/i] };
function loadVoices() {
  if (!("speechSynthesis" in window)) return;
  const all = speechSynthesis.getVoices() || [];
  const score = (L, v) => { const g = GOOD_VOICE[L].findIndex(r => r.test(v.name)); return (/^google/i.test(v.name) ? 0 : /enhanced|premium|améliorée|mejorada|neural|natural/i.test(v.name) ? 10 : 50) + (g < 0 ? 20 : g); };
  const pick = (code, L) => all.filter(v => String(v.lang || "").replace("_", "-").toLowerCase() === code && !BAD_VOICE.test(v.name)).sort((a, b) => score(L, a) - score(L, b));
  APP.voices.fr = pick("fr-fr", "fr"); APP.voices.es = pick("es-es", "es");
}
function chosenVoice(L) {
  loadVoices();
  const list = APP.voices[L]; if (!list.length) return null;
  const want = APP.settings.voice[L];
  return list.find(v => v.name === want) || list[0];
}
let curUtter = null;
function speak(L, text, rate) {
  if (!("speechSynthesis" in window)) { toast(t("noVoice")); return false; }
  const v = chosenVoice(L);
  if (!v) { toast(t("noVoice")); return false; }
  const u = new SpeechSynthesisUtterance(text);
  u.voice = v; u.lang = v.lang; u.rate = rate || 0.92; u.volume = 1;
  curUtter = u; // o Safari descarta a fala se nada guardar a referência
  const ss = window.speechSynthesis;
  if (ss.speaking || ss.pending) { ss.cancel(); setTimeout(() => ss.speak(u), 120); }
  else { if (ss.paused) ss.resume(); ss.speak(u); }
  return true;
}
function pollVoices() { let n = 0; const id = setInterval(() => { loadVoices(); if ((APP.voices.fr.length && APP.voices.es.length) || ++n > 20) { clearInterval(id); if (!APP.screen) render(); } }, 250); }

}

  const body = APP.tab === "notebook" ? viewNotebook() : APP.tab === "progress" ? viewProgress() : APP.tab === "settings" ? viewSettings() : viewToday();

// ---------- HOJE ----------
function viewToday() {
  const date = today();
  syncDayFlags(date);
  const { p, complete } = dayStatus(date);
  const kindLabel = { long: t("kLong"), class: t("kClass"), min: t("kMin") }[p.kind];
  let h = `<section class="dayhead"><p class="label">${esc(fmtDate(date, { weekday: "long" }))}</p><h1>${esc(fmtDate(date, { day: "numeric", month: "long" }))}</h1>
  <div class="row"><span class="pill acc">${kindLabel}</span>${p.langs.map(L => `<span class="pill">${langName(L)}</span>`).join("")}${complete ? `<span class="pill ok">${p.hard ? t("doneMin") : t("doneDay")}</span>` : ""}</div></section>`;
  h += `<section class="streak"><span><b class="mono">${streak()}</b> <span class="muted">${t(streak() === 1 ? "streakDay1" : "streakDays")}</span></span><span><b class="mono">${last28()}</b><span class="muted">/28 ${t("last4w")}</span></span></section>`;
  h += `<section class="toggles" aria-label="${t("classToggles")}">${LANG_LIST.map(L => `<button class="tog" data-act="cls" data-v="${L}" aria-pressed="${classOn(date, L)}"><span class="box"></span>${t("hadClass_" + L)}</button>`).join("")}<button class="tog hard" data-act="hard" aria-pressed="${p.hard}"><span class="box"></span>${t("hardDay")}</button></section>`;
  if (p.hard) h += `<p class="note">${p.cls.length ? t("hardClass") : t("hardNoClass")}</p>`;
  for (const L of LANG_LIST) { const ls = levelStatus(L); if (ls.ready) h += `<div class="card banner"><h3>${t("readyTitle", { lang: langName(L), lv: ls.next })}</h3><p>${t("readyBody")}</p></div>`; }
  if (APP.msg) h += `<div class="card ${APP.msg.warn ? "warnb" : ""}"><p>${esc(APP.msg.text)}</p><div><button class="btn small ghost" data-act="dismiss">${t("ok")}</button></div></div>`;
  if (!APP.sample) h += `<div class="card warnb"><p>${t("noSample")}</p></div>`;

  // folha de tarefas do dia
  const slots = [];
  for (const L of p.cls) slots.push({ kind: "class", L, done: true });
  const doneQ = {}; for (const L of LANG_LIST) doneQ[L] = blocksDone(date, L).slice().sort((a, b) => (a.doneTs || 0) - (b.doneTs || 0));
  const take = L => doneQ[L].shift() || null;
  if (p.monday) {
    const first = lessLang(date), other = first === "fr" ? "es" : "fr", seq = [first, first, other, other];
    seq.forEach((L, i) => { const b = take(L); slots.push({ kind: "block", L, done: !!b, b, texto: i === 2 }); });
  } else {
    for (const r of p.req) for (let i = 0; i < r.n; i++) { const b = take(r.L); slots.push({ kind: "block", L: r.L, done: !!b, b }); }
  }
  const reqLangsOpen = new Set(slots.filter(x => x.kind === "block" && !x.done).map(x => x.L));
  const extras = [];
  for (const L of LANG_LIST) for (const b of doneQ[L]) extras.push({ kind: "block", L, done: true, b, bonus: true });
  for (const b of APP.blocks.filter(x => x.status === "open" && !reqLangsOpen.has(x.lang))) extras.push({ kind: "block", L: b.lang, done: false, b, bonus: true, open: true });
  if (p.essay && !p.hard) { const e = APP.essays.find(x => x.date === date && x.lang === p.essay.L); slots.push({ kind: "essay", L: p.essay.L, done: !!(e && e.status === "done"), started: !!e, optional: p.essay.optional }); }
  for (const L of p.cls) slots.push({ kind: "log", L, done: APP.classes.some(c => c.date === date && c.lang === L) });
  slots.push(...extras);
  let nowSet = false;
  const rows = slots.map((s, i) => {
    let now = false;
    if (!s.done && !nowSet && s.kind !== "log" && !s.bonus) { now = true; nowSet = true; }
    if (s.open) now = true;
    const ob = s.kind === "block" ? APP.blocks.find(b => b.lang === s.L && b.status === "open") : null;
    let title = "", sub = "", act = "";
    if (s.kind === "class") { title = t("classOf", { lang: langName(s.L) }); sub = t("classSub"); }
    if (s.kind === "block") {
      title = ((s.texto || (s.b && s.b.kind === "texto")) ? t("blockText") : t("block")) + " · " + langName(s.L) + (s.bonus ? " · " + t("bonus") : "");
      if (s.done && s.b) {
        const atts = s.b.attempts.map(id => APP.attempts.find(a => a.id === id)).filter(Boolean);
        sub = t("blockScore", { p: atts.reduce((x, a) => x + a.score, 0), n: atts.length * 2, t: mmss(s.b.totalMs || 0) });
        act = `<button class="btn ghost small" data-act="viewBlock" data-v="${s.b.id}">${t("see")}</button>`;
      } else {
        sub = ob && now ? t("resume", { i: ob.attempts.length, n: ob.qids.length }) : s.texto ? t("blockTextSub") : t("blockSub", { n: APP.settings.blockSize[s.L] || 8 });
        if (now) act = `<button class="btn primary small" data-act="openBlock" data-v="${s.L}">${ob ? t("continue") : t("start")}</button>`;
      }
    }
    if (s.kind === "essay") {
      title = t("essayOf", { lang: langName(s.L) }) + (s.optional ? " · " + t("optional") : "");
      sub = t("essaySub");
      if (!s.done && (now || s.optional)) act = `<button class="btn ${now ? "primary" : ""} small" data-act="openEssay" data-v="${s.L}">${s.started ? t("continue") : t("start")}</button>`;
    }
    if (s.kind === "log") {
      title = t("logOf", { lang: langName(s.L) }); sub = s.done ? t("logDone") : t("logSub");
      if (!s.done) act = `<button class="btn small" data-act="openLog" data-v="${s.L}">${t("note")}</button>`;
    }
    return `<div class="slot ${s.done ? "done" : ""} ${now ? "now" : ""}"><span class="n">${s.done ? "✓" : s.bonus ? "+" : i + 1}</span><div class="t"><b>${esc(title)}</b><span>${esc(sub)}</span></div><div>${act}</div></div>`;
  });
  h += `<section class="runsheet" aria-label="${t("todayPlan")}">${rows.join("") || `<div class="slot done"><span class="n">✓</span><div class="t"><b>${t("onlyClass")}</b></div><div></div></div>`}</section>`;
  if (complete) {
    const langs = p.monday ? LANG_LIST : p.langs;
    h += `<section class="card"><h3>${t("moreTitle")}</h3><p class="note">${t("moreSub")}</p><div class="row">${langs.map(L => `<button class="btn" data-act="openBlock" data-v="${L}">${t("oneMore")} · ${langName(L)}</button>`).join("")}</div></section>`;
  }
  return h;
}

// ---------- TELAS DE FOCO ----------
function renderScreen() {
  const s = APP.screen;
  if (s.kind === "block") return renderBlock();
  if (s.kind === "blockdone") return renderBlockDone();
  if (s.kind === "essay") return renderEssay();
  if (s.kind === "classlog") return renderClassLog();
  if (s.kind === "wait") { $app().innerHTML = `<div class="focus"><div class="fbar"><div class="row"><span class="label">${esc(s.title || "")}</span></div></div><div class="sheetp"><p class="thinking">${esc(s.text || t("thinking"))}</p></div></div>`; }
}
const blk = () => APP.blocks.find(b => b.id === APP.screen.blockId);
function focusBar(label, ms, targetMs, right) {
  const pct = Math.min(100, (ms / targetMs) * 100), late = ms > targetMs;
  return `<div class="fbar"><div class="row"><span class="label">${esc(label)}</span><span class="row" style="flex-wrap:nowrap"><span class="clock ${late ? "late" : ""}" id="clock">${mmss(ms)} / ${mmss(targetMs)}</span>${right || ""}<button class="btn ghost small" data-act="closeScreen">${t("close")}</button></span></div><div class="tbar ${late ? "late" : ""}" id="tbar"><i style="width:${pct}%"></i></div></div>`;
}
function blockElapsed() { const b = blk(), s = APP.screen; return (b ? b.totalMs || 0 : 0) + (s.segStart ? Date.now() - s.segStart : 0); }
const typeInstr = q => t("ty_" + q.ty);

function renderBlock() {
  const s = APP.screen, b = blk();
  if (!b) { APP.screen = null; return render(); }
  const q = qById(b.qids[s.idx]);
  if (!q) { s.idx++; if (s.idx >= b.qids.length) return finishBlock(); return renderBlock(); }
  const L = b.lang;
  const dots = b.qids.map((id, i) => { const a = APP.attempts.find(x => x.id === b.attempts[i]); return `<i class="${a ? "d" + a.score : ""} ${i === s.idx ? "cur" : ""}"></i>`; }).join("");
  let h = focusBar(`${t("block")} · ${langName(L)} · ${s.idx + 1}/${b.qids.length}`, blockElapsed(), 10 * 60000);
  h += `<div class="dots" aria-hidden="true">${dots}</div>`;
  if (b.kind === "texto" && b.text && q.src === "texto") h += `<article class="card"><p class="label">${t("readFirst")}</p><h2>${esc(b.text.title)}</h2><p style="white-space:pre-wrap">${esc(b.text.body)}</p></article>`;
  const tp = TOPIC[q.t];
  h += `<section class="sheetp"><div class="meta"><span class="cat">${esc(tp.n)}</span><span class="cat">${anyLevel(q) ? APP.st[L].level : q.lv}</span>${q.src !== "seed" ? `<span class="cat">${t("src_" + q.src)}</span>` : ""}${APP.st[L].srs[q.id] && s.phase === "answer" ? `<span class="cat">${t("review")}</span>` : ""}</div>`;
  h += `<p class="qinstr">${esc(q.i || typeInstr(q))}</p>`;
  if (q.ty === "dit") {
    h += `<div class="listen"><button class="btn" data-act="listen" data-v="1" ${s.replays >= 3 || s.phase !== "answer" ? "disabled" : ""}>${t("listen")}</button><button class="btn" data-act="listen" data-v="0.7" ${s.replays >= 3 || s.phase !== "answer" ? "disabled" : ""}>${t("slower")}</button><span class="note mono">${s.replays}/3</span>${chosenVoice(L) ? `<span class="note">· ${esc(chosenVoice(L).name)}</span>` : ""}</div>${s.phase === "answer" ? `<div class="row"><button class="btn ghost small" data-act="badAudio">${t("badAudio")}</button></div>` : ""}`;
    if (s.phase !== "answer") h += `<p class="qprompt">${esc(q.p)}</p>`;
  } else {
    if (q.ty === "cloze") {
      const parts = q.p.split("___"), a = s.phase === "result" ? APP.attempts.find(x => x.id === s.attId) : null;
      h += `<p class="qprompt cloze">${parts.map((p, i) => esc(p) + (i < parts.length - 1 ? (s.phase === "answer" ? `<input class="blank" id="bl${i}" lang="${L}" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="${i + 1}" value="${esc((s.blanks || [])[i] || "")}">` : clozeCell(q, a, i)) : "")).join("")}</p>`;
    } else h += `<p class="qprompt ${q.ty === "trad" ? "pt" : ""}">${esc(q.p)}</p>`;
  }
  if (s.phase === "answer") {
    if (q.ty === "mc") h += `<div class="opts">${q.o.map(o => `<button class="opt" data-act="sel" data-v="${esc(o)}" aria-pressed="${s.sel === o}">${esc(o)}</button>`).join("")}</div>`;
    else if (q.ty !== "cloze") h += `<textarea id="ans" rows="${q.ty === "mini" ? 4 : 2}" lang="${L}" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="${t("yourAnswer")}">${esc(s.draft)}</textarea>`;
    h += `<div class="row"><button class="btn primary" data-act="submit" ${q.ty === "mc" && !s.sel ? "disabled" : ""}>${t("correct")}</button></div>`;
  } else if (s.phase === "correcting") {
    h += `<p class="thinking">${t("correcting")}</p>`;
  } else if (s.phase === "selfgrade") {
    h += `<div class="qa"><b>${t("yourAnswer")}</b><span>${esc(s.draft || s.sel)}</span><b>${t("reference")}</b><span>${q.a.map(esc).join(" · ")}</span></div><p class="note">${t("selfGrade")}</p><div class="row"><button class="btn" data-act="self" data-v="2">${t("v2")}</button><button class="btn" data-act="self" data-v="1">${t("v1")}</button><button class="btn pen" data-act="self" data-v="0">${t("v0")}</button></div>`;
  } else if (s.phase === "result") {
    const a = APP.attempts.find(x => x.id === s.attId);
    h += resultHTML(q, a);
  }
  h += `</section>`;
  if (s.phase === "result") h += `<div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="next">${s.idx + 1 >= b.qids.length ? t("finish") : t("next")}</button></div>`;
  $app().innerHTML = `<div class="focus">${h}</div>`;
  const ta = document.getElementById("ans"); if (ta) { ta.focus(); ta.oninput = () => { s.draft = ta.value; }; }
  const bls = [...document.querySelectorAll("input.blank")];
  bls.forEach((el, i) => { el.oninput = () => { s.blanks = s.blanks || []; s.blanks[i] = el.value; }; el.onkeydown = ev => { if (ev.key === "Enter") { ev.preventDefault(); (bls[i + 1] || el).focus(); } }; });
  if (bls[0] && s.phase === "answer") bls[0].focus();
}
// texto completo de referência (lacunas preenchidas com a primeira alternativa)
function refText(q) { return q.ty === "cloze" ? q.p.split("___").map((p, i, arr) => p + (i < arr.length - 1 ? String(q.a[i] || "").split("|")[0] : "")).join("") : q.a[0]; }
function clozeCell(q, a, i) {
  const v = a && a.blanks ? (a.blanks[i] || "") : "", e = a ? (a.errors || []).find(x => x.blank === i) : null;
  return e ? `<span class="mk"><del>${esc(v || "∅")}</del><ins>${esc(e.fix)}</ins></span>` : `<b class="okfill">${esc(v)}</b>`;
}
function resultHTML(q, a) {
  const L = q.l, s = APP.screen;
  const ans = q.ty === "cloze" ? "" : q.ty === "mc" ? `<div class="opts">${q.o.map(o => `<div class="opt ${q.a.includes(o) ? "right" : o === a.answer ? "wrong" : ""}">${esc(o)}</div>`).join("")}</div>`
    : `<p class="pen">${penHTML(a.answer, a.errors)}</p>`;
  let h = `<div class="row" style="justify-content:space-between">${verdictHTML(a.score)}<span class="pill ${a.dif === "easy" ? "ok" : a.dif === "mid" ? "warn" : "pen"}" title="${esc(t(a.difWhy))}">${t("dif_" + a.dif)}</span></div>${ans}`;
  h += `<p class="why">${esc(t(a.difWhy))}</p>`;
  if (a.errors.length) h += notesHTML(L, a.errors, s.showPt);
  if (a.score < 2 || a.corrected) {
    const best = a.corrected && a.score < 2 ? a.corrected : refText(q);
    if (a.score < 2) h += `<div><p class="label">${t("correctVersion")}</p><p class="corr">${esc(best)}</p></div>`;
  }
  if (a.score === 2 && q.a.length && normTxt(q.a[0]) !== normTxt(a.answer) && !QTYPES[q.ty].closed) h += `<p class="note">${t("alsoPossible")} <span class="corr">${esc(q.a[0])}</span></p>`;
  if (a.feedback) h += `<p>${esc(a.feedback)}</p>${s.showPt && a.feedback_pt ? `<p class="pt muted"><i>${esc(a.feedback_pt)}</i></p>` : ""}`;
  if (a.contested) h += `<div class="qa"><b>${a.contested.accepted ? t("contestOk") : t("contestNo")}</b><span>${esc(a.contested.why)}</span>${s.showPt && a.contested.why_pt ? `<i class="muted">${esc(a.contested.why_pt)}</i>` : ""}</div>`;
  for (const d of a.doubts || []) h += `<div class="qa"><b>${esc(d.q)}</b><span>${esc(d.a)}</span>${s.showPt && d.a_pt ? `<i class="muted">${esc(d.a_pt)}</i>` : ""}</div>`;
  h += `<div class="row" style="justify-content:space-between"><button class="ptbtn" data-act="pt">${s.showPt ? t("hidePt") : t("showPt")}</button>${q.src !== "seed" ? `<button class="btn ghost small" data-act="discard">${t("discard")}</button>` : ""}</div>`;
  if (APP.sample) {
    h += `<div class="doubt"><label class="label" for="doubt">${t("doubtLabel")}</label><textarea id="doubt" rows="2" placeholder="${t("doubtPh")}">${esc(s.doubtDraft || "")}</textarea><div class="row"><button class="btn small" data-act="doubt" ${s.busy ? "disabled" : ""}>${t("ask")}</button>${a.score < 2 && !a.contested ? `<button class="btn small pen" data-act="contest" ${s.busy ? "disabled" : ""}>${t("contest")}</button>` : ""}${s.busy ? `<span class="thinking">${t("thinking")}</span>` : ""}</div></div>`;
  }
  return h;
}
function renderBlockDone() {
  const s = APP.screen, b = APP.blocks.find(x => x.id === s.blockId);

  <section class="sheetp"><p class="verdict ${pts >= atts.length * 1.7 ? "ok" : "mid"}">${pts}/${atts.length * 2}</p><p>${t("blockDoneBody", { t: mmss(b.totalMs || 0) })}</p>${b.bonus ? `<p class="pill acc" style="justify-self:start">${t("bonus")}</p>` : ""}${complete ? `<p><b>${t("dayCompleteMsg")}</b></p>` : ""}
  <div class="dots">${atts.map(a => `<i class="d${a.score}"></i>`).join("")}</div></section>
  <section class="card">${atts.map((a, k) => { const q = qById(a.qid); return `<div class="err"><div class="row"><span class="mono note">${k + 1}.</span>${verdictHTML(a.score)}<span class="cat">${esc(TOPIC[a.topic] ? TOPIC[a.topic].n : a.topic)}</span></div>${q ? `<p class="small muted">${esc(q.i || typeInstr(q))} ${q.ty === "dit" || q.ty === "cloze" ? "" : "— " + esc(q.p)}</p>` : ""}${q && q.ty === "cloze" ? `<p class="pen cloze" style="font-size:16px;line-height:2">${q.p.split("___").map((p, i, arr) => esc(p) + (i < arr.length - 1 ? clozeCell(q, a, i) : "")).join("")}</p>` : `<p class="pen" style="font-size:16px;line-height:2">${penHTML(a.answer, a.errors)}</p>`}${a.score < 2 && q && q.ty !== "cloze" ? `<p class="corr">${esc(a.corrected || refText(q))}</p>` : ""}${(a.errors || []).filter(e => e.why).map(e => `<p class="why">${esc(e.why)}</p>`).join("")}</div>`; }).join("")}</section>
  <div class="row"><button class="btn primary" data-act="closeScreen">${t("back")}</button>${complete ? `<button class="btn" data-act="openBlock" data-v="${b.lang}">${t("oneMore")}</button>` : ""}</div></div>`;
}

// ---------- REDAÇÃO ----------
function renderEssay() {
  const s = APP.screen, e = APP.essays.find(x => x.id === s.essayId), L = s.lang;
  if (!e) { APP.screen = null; return render(); }
  const task = e.task, cfg = ESSAY_LEVELS[e.lv] || ESSAY_LEVELS.A2;
  const stage = e.stage;
  const targets = { plan: 3, write: 15, rewrite: 6 };
  const ms = (e[stage + "Ms"] || 0) + (s.segStart && targets[stage] ? Date.now() - s.segStart : 0);
  let h = targets[stage] ? focusBar(`${t("essay")} · ${langName(L)} · ${t("st_" + stage)}`, ms, targets[stage] * 60000) : `<div class="fbar"><div class="row"><span class="label">${t("essay")} · ${langName(L)}</span><button class="btn ghost small" data-act="closeScreen">${t("close")}</button></div></div>`;
  const scaffold = full => {
    let x = `<div class="scaffold"><p class="label">${esc(task.fmt)} · ${cfg.words[0]}–${cfg.words[1]} ${t("words")}</p><p class="qprompt">${esc(task.sit)}</p>`;
    if (task.pts && task.pts.length && cfg.scaffold !== "task" && cfg.scaffold !== "open") x += `<div><p class="label">${t("mustInclude")}</p><ul>${task.pts.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>`;

function spark(v) {
  const w = 120, hgt = 26, n = v.length, x = i => n === 1 ? w / 2 : 4 + i * (w - 8) / (n - 1), y = val => hgt - 4 - (val / 5) * (hgt - 8);

}

  const x = i => vals.length === 1 ? (pl + W - pr) / 2 : pl + i * (W - pl - pr) / (vals.length - 1), y = v => pt + (1 - v / max) * (H - pt - pb);
  const ticks = [0, max / 2, max];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("per100Title")}">${ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`).join("")}<polygon fill="var(--accent-soft)" points="${pl},${y(0)} ${vals.map((v, i) => `${x(i)},${y(v)}`).join(" ")} ${x(vals.length - 1)},${y(0)}"/><polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${vals.map((v, i) => `${x(i)},${y(v)}`).join(" ")}"/>${vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${i === vals.length - 1 ? 5 : 3}" fill="var(--accent)"/>`).join("")}${labels.map((l, i) => (vals.length <= 8 || i % Math.ceil(vals.length / 8) === 0 || i === vals.length - 1) ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${esc(l)}</text>` : "").join("")}</svg></div>`;
}

async function openBlock(L) {
  if (APP.screen && APP.screen.kind === "block") return;
  startSession(L);
  let b = APP.blocks.find(x => x.lang === L && x.status === "open");
  if (!b) {
    const date = today(), p = plan(date);
    const reqN = (p.req.find(r => r.L === L) || { n: 0 }).n;
    const bonus = blocksDone(date, L).length >= reqN;
    const wantText = p.monday && !bonus && blocksDone(date).length === 2 && !APP.blocks.some(x => x.kind === "texto" && x.date === date) && APP.sample;
    b = { id: uid("b"), lang: L, kind: "normal", created: Date.now(), date, status: "open", qids: [], attempts: [], totalMs: 0, bonus };
    if (wantText) {
      APP.screen = { kind: "wait", lang: L, title: t("blockText") + " · " + langName(L), text: t("writingText") }; render();
      try {
        const tx = await generateText(L);
        if (tx.body && tx.qs.length) {
          await storeQs(tx.qs);
          b.kind = "texto"; b.text = { title: tx.title, body: tx.body };
          const reviews = buildBlockItems(L).filter(id => APP.st[L].srs[id]).slice(0, 2);
          b.qids = [...tx.qs.map(q => q.id), ...reviews];
        }
      } catch (e) { console.warn(e); }
    }
    if (!b.qids.length) b.qids = buildBlockItems(L);
    if (!b.qids.length) { APP.screen = null; toast(t("noQuestions")); return render(); }
    APP.blocks.unshift(b); save("blocks", b.id, b);
  }
  APP.screen = { kind: "block", lang: L, blockId: b.id, idx: b.attempts.length, phase: "answer", draft: "", sel: null, replays: 0, qStart: Date.now(), segStart: Date.now(), showPt: false };
  render(); tick(); ensurePool(L);
}
function closeSegment() {
  const s = APP.screen; if (!s || !s.segStart) return;
  if (s.kind === "block") { const b = blk(); if (b) { b.totalMs = (b.totalMs || 0) + (Date.now() - s.segStart); save("blocks", b.id, b); } }
  if (s.kind === "essay") { const e = APP.essays.find(x => x.id === s.essayId); const k = e && e.stage + "Ms"; if (e && ["plan", "write", "rewrite"].includes(e.stage)) { e[k] = (e[k] || 0) + (Date.now() - s.segStart); save("essays", e.id, e); } }
  s.segStart = Date.now();
}
async function submitAnswer() {
  const s = APP.screen, b = blk(), q = qById(b.qids[s.idx]);
  const ta = document.getElementById("ans"); if (ta) s.draft = ta.value;
  if (q.ty === "cloze") s.blanks = [...document.querySelectorAll("input.blank")].map(el => el.value);
  const answer = q.ty === "mc" ? s.sel : q.ty === "cloze" ? (s.blanks || []).map(x => x.trim() || "∅").join(" · ") : (s.draft || "").trim();
  if (!answer || (q.ty === "cloze" && (s.blanks || []).every(x => !x.trim()))) { toast(t("emptyAnswer")); return; }
  s.answerMs = Date.now() - s.qStart; s.phase = "correcting"; render();
  let res = null;
  try {
    if (QTYPES[q.ty].closed) {
      res = gradeClosed(q, answer, s.blanks);
      if (res.score < 2 && APP.sample) { try { const ex = await explainClosed(q, answer); res.errors = res.errors.map(e => ({ ...e, why: ex.why, why_pt: ex.why_pt })); } catch (e) { } }
    } else res = await correctOpen(q, answer);
  } catch (e) { console.warn(e); res = null; }
  if (APP.screen !== s) return;
  if (!res) { s.phase = "selfgrade"; return render(); }
  finalizeAttempt(q, answer, res, false);
}
function finalizeAttempt(q, answer, res, selfGraded) {
  const s = APP.screen, b = blk(), L = q.l;
  const att = { id: uid("a"), lang: L, qid: q.id, qlv: q.lv, topic: q.t, qcat: q.c, type: q.ty, src: q.src, ts: Date.now(), date: today(), blockId: b.id,
    answer, blanks: q.ty === "cloze" ? (s.blanks || []) : undefined, score: res.score, targetOk: res.targetOk, errors: res.errors || [], ptInterf: (res.errors || []).some(e => e.pt), orthoErr: (res.errors || []).some(e => e.ortho),
    corrected: res.corrected || "", feedback: res.feedback || "", feedback_pt: res.feedback_pt || "", answerMs: s.answerMs || 0, replays: s.replays || 0, doubts: [], selfGraded,
    srsBefore: APP.st[L].srs[q.id] ? { ...APP.st[L].srs[q.id] } : null };
  const c = classify(att, q); att.dif = c.dif; att.difWhy = c.why;
  applySrs(L, q.id, c.dif, att.srsBefore); saveState(L);
  APP.attempts.unshift(att); save("attempts", att.id, att);
  b.attempts.push(att.id); save("blocks", b.id, b);
  s.phase = "result"; s.attId = att.id; render();
}
function reclassify(att) {
  const q = qById(att.qid); if (!q) return;
  const c = classify(att, q);
  att.dif = c.dif; att.difWhy = c.why;
  applySrs(att.lang, q.id, c.dif, att.srsBefore); saveState(att.lang); save("attempts", att.id, att);
}
function nextQuestion() {
  const s = APP.screen, b = blk();
  s.idx++; s.phase = "answer"; s.draft = ""; s.sel = null; s.blanks = []; s.replays = 0; s.qStart = Date.now(); s.doubtDraft = ""; s.busy = false;
  if (s.idx >= b.qids.length) return finishBlock();

}
function finishBlock() {
  const s = APP.screen, b = blk();
  b.totalMs = (b.totalMs || 0) + (Date.now() - s.segStart); s.segStart = null;
  b.status = "done"; b.doneDate = today(); b.doneTs = Date.now(); save("blocks", b.id, b);

  APP.screen = { kind: "blockdone", lang: b.lang, blockId: b.id }; render();
}

async function openEssay(L) {
  const date = today();
  let e = APP.essays.find(x => x.date === date && x.lang === L && x.status !== "dropped");
  if (!e) {
    const lv = APP.st[L].level;

    let task = ESSAY_TASKS[L].filter(k => k.lv === lv).sort((a, b) => (used[a.id] || 0) - (used[b.id] || 0))[0];
    if (!task || (used[task.id] || 0) > 0 && APP.sample) {
      APP.screen = { kind: "wait", lang: L, title: t("essay"), text: t("preparingTask") }; render();
      try { task = await generateTask(L); } catch (err) { console.warn(err); }
    }
    if (!task) { APP.screen = null; toast(t("noTask")); return render(); }
    e = { id: uid("e"), lang: L, date, ts: Date.now(), lv, task, plan: "", text: "", rewrite: "", stage: "task", status: "open" };
    APP.essays.unshift(e); save("essays", e.id, e);
  }
  APP.screen = { kind: "essay", lang: L, essayId: e.id, segStart: Date.now(), showPt: false };
  render(); tick();
}
async function essayGo(stage) {

async function essaySubmit() {

async function storeQs(qs) {
  for (const q of qs) { APP.gq.push(q); await save("questions", q.id, q); }
}
function ensurePool(L) {
  const st = APP.st[L], ub = unseenByTopic(L);
  const low = levelTopics(L, st.level).filter(tp => (ub[tp.id] ? ub[tp.id].unseen : 0) < 3).slice(0, 2);
  for (const tp of low) if (!APP.genQueue.some(j => j.topic === tp.id)) APP.genQueue.push({ L, topic: tp.id, n: 6 });
  runGen();
}
async function runGen() {
  if (APP.genRunning || !APP.sample) return;
  APP.genRunning = true;
  while (APP.genQueue.length) {
    const j = APP.genQueue.shift();
    try { const qs = await generateForTopic(j.L, j.topic, j.n); await storeQs(qs); } catch (e) { console.warn("gen", e); if (e && (e.code === "not_granted" || e.code === "rate_limited")) { APP.genQueue = []; } }
  }
  APP.genRunning = false;
}
async function submitClassLog() {
  const s = APP.screen, L = s.lang, st = APP.st[L];
  const lines = v => String(v || "").split(/\n+/).map(x => x.trim()).filter(Boolean);
  const doc = { id: uid("c"), lang: L, date: today(), ts: Date.now(), theme: (s.theme || "").trim(), errs: lines(s.errs), words: lines(s.words), gen: s.gen !== false, result: "" };
  if (!doc.theme && !doc.errs.length && !doc.words.length) { toast(t("logEmpty")); return; }
  APP.classes.unshift(doc); save("classes", doc.id, doc);
  APP.screen = null; APP.msg = { text: t("logProcessing") }; render();
  const msgs = [];
  try {
    if (doc.gen && doc.theme && APP.sample) {
      const ids = await classifyClass(L, doc.theme);
      for (const id of ids) {
        const unseen = (unseenByTopic(L)[id] || { unseen: 0 }).unseen;
        st.boost[id] = st.session + 5;
        if (unseen >= 8) msgs.push(t("genEnough", { n: unseen, topic: TOPIC[id].n }));
        else { const qs = await generateForTopic(L, id, 12 - unseen, "Theme seen in class today: " + doc.theme); await storeQs(qs.map(q => ({ ...q, src: "aula" }))); msgs.push(t("genMade", { n: qs.length, topic: TOPIC[id].n })); }
      }
      saveState(L);
      if (!ids.length) msgs.push(t("genNoTopic"));
    }
    if (doc.errs.length && APP.sample) { const qs = await generateFromErrors(L, doc.errs.map(x => ({ erro: x })), "aula"); await storeQs(qs); msgs.push(t("genErrs", { n: qs.length })); }
    if (doc.words.length && APP.sample) { const qs = await generateVocab(L, doc.words, doc.theme); await storeQs(qs); msgs.push(t("genWords", { n: qs.length })); }
  } catch (e) { console.warn(e); msgs.push(t("genFail")); }
  doc.result = msgs.join(" "); save("classes", doc.id, doc);
  APP.msg = { text: msgs.length ? msgs.join(" ") : t("logSaved") }; if (!APP.screen) render();
}

// timer da sessão (atualiza só o relógio, sem re-render)
let tickT;
function tick() {
  clearInterval(tickT);
  tickT = setInterval(() => {
    const s = APP.screen; if (!s || !s.segStart) return;
    let ms, target;
    if (s.kind === "block") { ms = blockElapsed(); target = 10 * 60000; }
    else if (s.kind === "essay") { const e = APP.essays.find(x => x.id === s.essayId); const tg = { plan: 3, write: 15, rewrite: 6 }[e && e.stage]; if (!tg) return; ms = (e[e.stage + "Ms"] || 0) + Date.now() - s.segStart; target = tg * 60000; }
    else return;
    const c = document.getElementById("clock"), b = document.getElementById("tbar");
    if (c) { c.textContent = mmss(ms) + " / " + mmss(target); c.classList.toggle("late", ms > target); }
    if (b) { b.classList.toggle("late", ms > target); b.firstElementChild.style.width = Math.min(100, ms / target * 100) + "%"; }
  }, 1000);
}

document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]"); if (!el || el.disabled) return;
  const act = el.dataset.act, v = el.dataset.v, s = APP.screen;
  if (act === "voice") return;
  switch (act) {
    case "tab": APP.tab = v; render(); window.scrollTo(0, 0); break;
    case "dismiss": APP.msg = null; render(); break;
    case "cls": { const d = today(), cur = classOn(d, v); APP.days[d] = { ...dayDoc(d), ["class_" + v]: !cur }; saveDay(d); syncDayFlags(d); render(); break; }
    case "hard": { const d = today(); APP.days[d] = { ...dayDoc(d), hard: !dayDoc(d).hard }; saveDay(d); syncDayFlags(d); render(); break; }
    case "openBlock": openBlock(v); break;
    case "openEssay": openEssay(v); break;
    case "openLog": APP.screen = { kind: "classlog", lang: v, gen: true }; render(); break;
    case "closeScreen": closeSegment(); if (s) s.segStart = null; APP.screen = null; clearInterval(tickT); render(); window.scrollTo(0, 0); break;
    case "sel": s.sel = v; render(); break;
    case "submit": submitAnswer(); break;
    case "next": nextQuestion(); break;
    case "pt": s.showPt = !s.showPt; render(); break;
    case "listen": { const q = qById(blk().qids[s.idx]); if (s.replays >= 3) return; if (speak(q.l, q.p, Number(v) * 0.92)) { s.replays++; render(); } break; }
    case "self": { const q = qById(blk().qids[s.idx]); const sc = Number(v); finalizeAttempt(q, q.ty === "mc" ? s.sel : s.draft, { score: sc, targetOk: sc > 0, errors: sc < 2 ? [{ cat: q.c, frag: "", fix: q.a[0], why: "", why_pt: "", pt: false, ortho: false }] : [] }, true); break; }
    case "doubt": {
      const ta = document.getElementById("doubt"); const qtext = (ta && ta.value || "").trim(); if (!qtext) return;
      const a = APP.attempts.find(x => x.id === s.attId), q = qById(a.qid);
      s.busy = true; s.doubtDraft = qtext; render();
      try { const r = await askDoubt(q, a, qtext); a.doubts = [...(a.doubts || []), { q: qtext, ...r }]; reclassify(a); s.doubtDraft = ""; } catch (e) { toast(t("askFail")); }
      s.busy = false; if (APP.screen === s) render(); break;
    }
    case "contest": {
      const ta = document.getElementById("doubt"); const reason = (ta && ta.value || "").trim();
      const a = APP.attempts.find(x => x.id === s.attId), q = qById(a.qid);
      s.busy = true; render();
      try { const r = await contest(q, a, reason); a.contested = { accepted: r.accepted, why: r.why, why_pt: r.why_pt, prevScore: a.score };
        if (r.accepted) { a.score = r.score; a.errors = r.errors; a.targetOk = r.score > 0; a.ptInterf = r.errors.some(e => e.pt); a.orthoErr = r.errors.some(e => e.ortho); }
        reclassify(a); s.doubtDraft = ""; } catch (e) { toast(t("askFail")); }
      s.busy = false; if (APP.screen === s) render(); break;
    }
    case "badAudio": {
      const b = blk(); b.qids.splice(s.idx, 1); save("blocks", b.id, b);
      APP.settings.dictOff = { ...(APP.settings.dictOff || {}), [b.lang]: true }; saveSettings();
      s.phase = "answer"; s.draft = ""; s.replays = 0; s.qStart = Date.now();
      if (s.idx >= b.qids.length) return finishBlock();
      toast(t("dictPaused")); render(); break;
    }
    case "dictToggle": { APP.settings.dictOff = { ...(APP.settings.dictOff || {}), [v]: !(APP.settings.dictOff || {})[v] }; saveSettings(); render(); break; }
    case "goNb": { const [x, c] = v.split(":"); APP.nbLang = x; APP.nbCat = c; APP.tab = "notebook"; render(); window.scrollTo(0, 0); break; }
    case "viewBlock": { const b = APP.blocks.find(x => x.id === v); if (b) { APP.screen = { kind: "blockdone", lang: b.lang, blockId: b.id }; render(); window.scrollTo(0, 0); } break; }
    case "discard": {
      const a = APP.attempts.find(x => x.id === s.attId), q = qById(a.qid);
      if (q && q.src !== "seed") { q.disc = true; save("questions", q.id, q); delete APP.st[q.l].srs[q.id]; saveState(q.l); toast(t("discarded")); }
      break;
    }
    case "essayGo": essayGo(v); break;
    case "newTask": {
      const e = APP.essays.find(x => x.id === s.essayId); s.busy = true; render();
      try { e.task = await generateTask(e.lang); save("essays", e.id, e); } catch (err) { toast(t("askFail")); }
      s.busy = false; render(); break;
    }
    case "essaySubmit": essaySubmit(); break;
    case "copyOrig": { const e = APP.essays.find(x => x.id === s.essayId); e.rewrite = e.text; save("essays", e.id, e); render(); break; }
    case "rewriteSubmit": rewriteSubmit(); break;
    case "lgGen": s.gen = s.gen === false; render(); break;
    case "logSave": submitClassLog(); break;
    case "nbLang": APP.nbLang = v; APP.nbCat = ""; render(); break;
    case "nbCat": APP.nbCat = v; APP.nbShow = 60; render(); break;
    case "nbPt": APP.nbPt = !APP.nbPt; render(); break;
    case "nbMore": APP.nbShow += 60; render(); break;
    case "progLang": APP.progLang = v; render(); break;
    case "setLang": APP.setLang = v; render(); break;
    case "lvChange": APP.confirmLv = v; render(); break;
    case "lvConfirm": { const sel = document.getElementById("lv_" + v); const lv = sel ? sel.value : APP.st[v].level; if (lv !== APP.st[v].level) { APP.st[v].level = lv; APP.st[v].levelSince = today(); saveState(v); toast(t("levelChanged", { lang: langName(v), lv })); } APP.confirmLv = null; render(); break; }
    case "bsize": { const [x, n] = v.split(":"); APP.settings.blockSize[x] = Number(n); saveSettings(); render(); break; }
    case "testVoice": speak(v, v === "fr" ? "Bonjour ! Je suis la voix de vos dictées." : "¡Hola! Soy la voz de tus dictados."); break;
    case "genHistory": {
      APP.genBusy = true; render();
      try { const qs = await generateFromHistory(v, 10); await storeQs(qs); toast(t("genDone", { n: qs.length })); } catch (e) { toast(t("askFail")); }
      APP.genBusy = false; render(); break;
    }
  }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.act === "voice") { APP.settings.voice[el.dataset.v] = el.value; saveSettings(); }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey) && APP.screen && APP.screen.kind === "block") {
    if (APP.screen.phase === "answer") submitAnswer(); else if (APP.screen.phase === "result") nextQuestion();
  }
});
document.addEventListener("visibilitychange", () => {
  if (!APP.screen) return;
  if (document.hidden) closeSegment();
  else if (APP.screen.segStart) APP.screen.segStart = Date.now(); // tempo com a aba escondida não conta
});

// ---------- boot ----------
async function boot() {
  render();
  loadVoices(); pollVoices();
  if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => { loadVoices(); if (!APP.screen) render(); };
  if (!window.claude || !window.claude.use) { APP.status = "nodb"; return render(); }
  const [db, sample, user] = await Promise.all([window.claude.use("db"), window.claude.use("sample"), window.claude.use("user")]);
  const me = user ? await user.id() : null;
  if (!db || !me) { APP.status = "nodb"; return render(); }
  APP.db = db; APP.sample = sample;
  APP.base = db.doc("data/users/" + me + "/caderno");
  try { await loadAll(); } catch (e) { console.warn("load", e); }
  for (const L of LANG_LIST) if (!APP.st[L]) APP.st[L] = defaultState();
  // redações abertas de dias anteriores não acumulam
  for (const e of APP.essays) if (e.status === "open" && e.date !== today()) { e.status = "dropped"; save("essays", e.id, e); }
  APP.status = "ready"; render();
}
boot();

</script>
